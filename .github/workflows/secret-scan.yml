# Reusable: gitleaks and a check for absolute local paths on the new commits of a pull request or a push.
# A run without a base commit (manual run, new branch, rewritten history) scans the whole history.
name: Secret scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Range to scan
        run: |
          if git rev-parse -q --verify "$BASE^{commit}" > /dev/null; then
            echo "LOG_OPTS=$BASE..$HEAD" >> "$GITHUB_ENV"
            echo "DIFF_RANGE=$BASE...$HEAD" >> "$GITHUB_ENV"
          else
            # No base commit: every commit for gitleaks, every line of HEAD (diff against the empty tree) for the paths.
            echo "LOG_OPTS=" >> "$GITHUB_ENV"
            echo "DIFF_RANGE=$(git hash-object -t tree /dev/null)..$HEAD" >> "$GITHUB_ENV"
          fi

      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --verbose --log-opts "$LOG_OPTS"

      - name: Absolute local paths
        run: |
          # Prints «file:line: text» for every added line that holds an absolute local path.
          found=$(git diff --no-color -U0 "$DIFF_RANGE" | awk '
            /^diff --git / { header = 1; next }
            header && /^\+\+\+ / { file = substr($0, 7); sub(/\t$/, "", file); next }
            /^@@ / { header = 0; split($3, start, ","); line = start[1] + 0; next }
            header || !/^\+/ { next }
            {
              text = substr($0, 2)
              if (text ~ /\/home\/[A-Za-z0-9_.-]+\/|\/Users\/[A-Za-z0-9_.-]+\/|[A-Za-z]:[\\\/](Users|home)[\\\/]/ \
                  && text !~ /\/home\/user\//)
                print file ":" line ": " text
              line++
            }')
          if [ -n "$found" ]; then
            echo "$found"
            echo "FAIL: absolute local path added, see «file:line: text» above; write example paths as /…/"
            exit 1
          fi
