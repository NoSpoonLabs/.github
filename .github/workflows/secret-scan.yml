# Reusable: gitleaks and a check for absolute local paths on the commits of a pull request.
name: Secret scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (commits of this pull request)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --verbose --log-opts "$BASE..$HEAD"

      - name: Absolute local paths (lines added by this pull request)
        run: |
          found=$(git diff --no-color -U0 "$BASE...$HEAD" | grep -E '^\+[^+]' \
            | grep -E '/home/[A-Za-z0-9_.-]+/|/Users/[A-Za-z0-9_.-]+/|[A-Za-z]:[\\/](Users|home)[\\/]' \
            | grep -v '/home/user/' || true)
          if [ -n "$found" ]; then
            echo "$found"
            echo "FAIL: absolute local path added; write example paths as /…/"
            exit 1
          fi
