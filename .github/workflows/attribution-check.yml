# Reusable: sets the commit status «Attribution text check» on the head of a pull request. Red when a commit message,
# the PR title or body, or a comment or review of the PR contains tool attribution text ("Generated by Claude Code",
# Co-Authored-By: Claude, session links); green again once it is removed. Every event rescans the whole pull request
# through the API. Patterns and logic: scripts/attribution_check.py of this repository. Caller: README.md.
name: Attribution text

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

concurrency:
  group: attribution-text-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan and set status
    # issue_comment also fires for plain issues
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          repository: TheBigNeo-AI/.github
          ref: main
          sparse-checkout: scripts

      - name: Scan the pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python3 scripts/attribution_check.py pr "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --set-status
